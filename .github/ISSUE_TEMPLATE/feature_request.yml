name: Feature request
description: Propose a focused improvement to checklists or human photo review.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or user need
      description: Describe the need before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would the person making the list or the reviewer be able to do?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
  - type: textarea
    id: implications
    attributes:
      label: Data and compatibility implications
      description: Note photo access, reviewer permissions, storage, retention, notifications, platforms, or external services.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable behaviors that demonstrate completion.
    validations:
      required: true
