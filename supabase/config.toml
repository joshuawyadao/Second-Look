# Local integration stack only. Never use these settings as hosted provisioning.
project_id = "secondlook-m2-local"

[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12

[auth.email]
# Enable password sign-in; the global auth.enable_signup=false blocks public registration.
enable_signup = true
enable_confirmations = true

# Synthetic integration accounts are created through the local admin API only.
[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000
